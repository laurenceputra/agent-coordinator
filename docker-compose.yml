services:
  manager:
    build:
      context: .
    image: codex-manager-yolo:latest
    stdin_open: true
    tty: true
    environment:
      - CMY_PROJECT_ROOT=/workspace
      - CMY_ARTIFACT_DIR=/workspace/artifacts
      - CMY_MAX_PARALLEL_WORKERS=${CMY_MAX_PARALLEL_WORKERS:-8}
      - CMY_RETRY_LIMIT=${CMY_RETRY_LIMIT:-3}
      - CMY_LOCK_BACKOFF_SECONDS=${CMY_LOCK_BACKOFF_SECONDS:-0.2}
    volumes:
      - ./:/workspace
      - ${HOME}/.config/gh:/root/.config/gh
      - ${HOME}/.codex:/root/.codex
      - ${HOME}/.config/github-copilot:/root/.config/github-copilot
    command: ["codex_manager_yolo"]

  codex_worker:
    image: codex-manager-yolo:latest
    profiles: ["workers"]
    environment:
      - CMY_PROJECT_ROOT=/workspace
      - CMY_ARTIFACT_DIR=/workspace/artifacts
      - CMY_MAX_PARALLEL_WORKERS=${CMY_MAX_PARALLEL_WORKERS:-8}
      - CMY_RETRY_LIMIT=${CMY_RETRY_LIMIT:-3}
      - CMY_LOCK_BACKOFF_SECONDS=${CMY_LOCK_BACKOFF_SECONDS:-0.2}
    volumes:
      - ./:/workspace
      - ${HOME}/.config/gh:/root/.config/gh
      - ${HOME}/.codex:/root/.codex
    command: ["codex_manager_yolo", "--no-interactive"]

  copilot_worker:
    image: codex-manager-yolo:latest
    profiles: ["workers"]
    environment:
      - CMY_PROJECT_ROOT=/workspace
      - CMY_ARTIFACT_DIR=/workspace/artifacts
      - CMY_MAX_PARALLEL_WORKERS=${CMY_MAX_PARALLEL_WORKERS:-8}
      - CMY_RETRY_LIMIT=${CMY_RETRY_LIMIT:-3}
      - CMY_LOCK_BACKOFF_SECONDS=${CMY_LOCK_BACKOFF_SECONDS:-0.2}
    volumes:
      - ./:/workspace
      - ${HOME}/.config/gh:/root/.config/gh
      - ${HOME}/.config/github-copilot:/root/.config/github-copilot
    command: ["codex_manager_yolo", "--no-interactive"]
